<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>파일 아카이브</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <div class="eyebrow">HANDONG · FILE ARCHIVE</div>
            <h1>파일 아카이브</h1></div>
        <a class="btn btn-primary" th:href="@{/posts/new}">+ 새 자료 업로드</a></div>
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0 align-middle">
                <thead>
                <tr>
                    <th class="ps-4">번호</th>
                    <th>제목</th>
                    <th>첨부파일</th>
                    <th>작성일</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${posts}">
                    <td class="ps-4 text-secondary" th:text="${p.id}">1</td>
                    <td><a class="fw-semibold" th:href="@{/posts/{id}(id=${p.id})}" th:text="${p.title}">제목</a></td>
                    <td>
                        <span th:if="${!#lists.isEmpty(p.attachments)}"
                              class="badge bg-primary-subtle text-primary rounded-pill px-3"
                              th:text="'파일 ' + ${#lists.size(p.attachments)} + '개'">파일 1개</span>
                        <span th:if="${#lists.isEmpty(p.attachments)}"
                              class="text-muted small">없음</span>
                    </td>
                    <td class="text-secondary small" th:text="${#temporals.format(p.createdAt,'yyyy-MM-dd HH:mm')}">날짜
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(posts)}">
                    <td colspan="4" class="text-center text-secondary p-5">등록된 자료가 없습니다. 오른쪽 상단 버튼을 눌러 첫 자료를 공유해 보세요!
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
